name: Release (Windows & macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows installer & portable zip
        shell: pwsh
        run: |
          $version = ((Get-Content -Raw Cargo.toml) | Select-String 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc "/DMyAppVersion=$version" "installer\windows\doze.iss"

          Compress-Archive -Path "target\release\doze.exe", "assets\doze-icon.ico" -DestinationPath "dist\Doze-windows-x86_64.zip" -Force
          Copy-Item "installer\install.ps1" "dist\install.ps1"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Doze-Setup-x86_64.exe
            dist/Doze-windows-x86_64.zip
            dist/install.ps1

  build-macos:
    name: Build macOS Universal Installer
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binaries (arm64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create Universal binary & package .dmg / .tar.gz
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/doze \
            target/x86_64-apple-darwin/release/doze \
            -output dist/doze-universal
          chmod +x dist/doze-universal
          chmod +x installer/macos/package_macos.sh installer/install.sh
          ./installer/macos/package_macos.sh dist/doze-universal universal dist
          cp installer/install.sh dist/install.sh

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/Doze-macos-universal.dmg
            dist/Doze-macos-universal.tar.gz
            dist/install.sh

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum Doze-* install.* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Doze ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/Doze-Setup-x86_64.exe
            artifacts/Doze-windows-x86_64.zip
            artifacts/Doze-macos-universal.dmg
            artifacts/Doze-macos-universal.tar.gz
            artifacts/install.ps1
            artifacts/install.sh
            artifacts/SHA256SUMS.txt
