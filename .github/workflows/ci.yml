name: CI (Windows & macOS)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets || cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows Inno Setup installer & portable zip
        shell: pwsh
        run: |
          $version = ((Get-Content -Raw Cargo.toml) | Select-String 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Compile Inno Setup installer (pre-installed on windows-latest)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc "/DMyAppVersion=$version" "installer\windows\doze.iss"

          # Also produce portable zip
          Compress-Archive -Path "target\release\doze.exe", "assets\doze-icon.ico" -DestinationPath "dist\Doze-windows-x86_64.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doze-windows-x86_64
          path: |
            dist/Doze-Setup-x86_64.exe
            dist/Doze-windows-x86_64.zip
            installer/install.ps1

  build-macos:
    name: macOS (Universal arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binaries (arm64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create Universal macOS binary & package .app / .dmg / .tar.gz
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/doze \
            target/x86_64-apple-darwin/release/doze \
            -output dist/doze-universal
          chmod +x dist/doze-universal
          chmod +x installer/macos/package_macos.sh installer/install.sh
          ./installer/macos/package_macos.sh dist/doze-universal universal dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doze-macos-universal
          path: |
            dist/Doze-macos-universal.dmg
            dist/Doze-macos-universal.tar.gz
            installer/install.sh
